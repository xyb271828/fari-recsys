name: Recommender checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev,recsys]'
      - run: python -m ruff check discoverylib recsys services tests
      - run: python -m pytest -q
